<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview · Halfpenny</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app hp">
  <nav class="rail" aria-label="Main">
    <a class="mark" href="#" aria-label="Halfpenny home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1d5fd6"/><path d="M16 1a15 15 0 0 1 0 30z" fill="#0a3a80"/><path d="M9.5 21V11M9.5 16h4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>
    <a class="rail-item" href="#home" aria-current="page" title="Overview"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Overview</span></a>
    <a class="rail-item" href="#accounts" title="Accounts"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Accounts</span></a>
    <a class="rail-item" href="#budget" title="Plan"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Plan</span></a>
    <a class="rail-item" href="#list" title="Transactions"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Transactions</span></a>
    <a class="rail-item" href="#goals" title="Goals"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6"/></svg><span>Goals</span></a>
    <a class="rail-item util" href="#settings" title="Settings"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
  </nav>

  <main class="canvas">
    <div class="topbar">
      <div class="brand"><strong>Halfpenny</strong><span class="scope">Priya Shah · personal</span></div>
      <div class="sync"><span class="stamp" id="stamp">Synced today at 09:14</span><button class="btn ghost icon" id="refresh" type="button" aria-label="Sync accounts now"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-3.9M4 4v4h4M4 13a8 8 0 0 0 14.7 3.9M20 20v-4h-4"/></svg></button></div>
    </div>

    <div class="title-row">
      <div>
        <h1>October overview</h1>
        <p class="sub" id="finding"></p>
      </div>
      <a class="btn primary" href="#move">Move money</a>
    </div>

    <section aria-labelledby="acc-h" class="accounts-block">
      <h2 id="acc-h" class="sr-only">Accounts</h2>
      <div class="kpis accounts" id="accounts"></div>
    </section>

    <div class="grid main-row">
      <section class="panel span-7" aria-labelledby="cat-h">
        <header>
          <h2 id="cat-h">Spending by category</h2>
          <span class="meta" id="cat-meta"></span>
        </header>
        <div class="plan-summary" id="plan-summary"></div>
        <ul class="plan-key" id="plan-key"></ul>
        <ul class="cats" id="cats"></ul>
      </section>

      <section class="panel span-5 tx-panel" aria-labelledby="tx-h">
        <header>
          <h2 id="tx-h">Recent transactions</h2>
          <a class="card-link" href="#transactions" id="tx-all"></a>
        </header>
        <div class="tx-filter" id="tx-filter" hidden></div>
        <ul class="rows tx" id="tx"></ul>
      </section>
    </div>

    <div class="grid second-row">
      <section class="panel span-8" aria-labelledby="pace-h">
        <header>
          <h2 id="pace-h">Spending pace</h2>
          <span class="chart-legend" id="pace-legend"></span>
        </header>
        <div class="kpis tabs-kpis" role="tablist" id="pace-tabs" aria-label="Series"></div>
        <div class="chart" id="pace-chart"></div>
        <p class="note" id="pace-note"></p>
      </section>

      <section class="panel span-4 flow" aria-labelledby="due-h">
        <header>
          <h2 id="due-h">Due before 31 Oct</h2>
          <span class="meta" id="due-total"></span>
        </header>
        <ul class="rows due" id="due"></ul>
        <p class="pot" id="pot"></p>
        <header class="sub-head">
          <h3>Money in this month</h3>
          <span class="meta" id="in-total"></span>
        </header>
        <ul class="rows due" id="income"></ul>
      </section>
    </div>
  </main>
</div>
<script src="js/charts.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
